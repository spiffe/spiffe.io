[build]
publish = "public"
command = "pip install -r requirements.txt && make production-build"

[build.environment]
HUGO_VERSION = "0.163.3"
NODE_VERSION = "22"
PYTHON_VERSION = "3.12"

[context.deploy-preview]
publish = "redesign/dist"
command = "cd redesign && npm ci && npm run build"

[context.deploy-preview.environment]
NODE_VERSION = "24"

[context.branch-deploy]
command = "pip install -r requirements.txt && make preview-build"
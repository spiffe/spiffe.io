[build]
publish = "astro/dist"
command = "pip install -r requirements.txt && REQUIRE_RELEASES=true make pull-external-content && npm --prefix astro ci && npm --prefix astro run build"

[build.environment]
NODE_VERSION = "22"
PYTHON_VERSION = "3.12"

[context.deploy-preview]
command = "pip install -r requirements.txt && make pull-external-content && npm --prefix astro ci && npm --prefix astro run build"

[context.branch-deploy]
command = "pip install -r requirements.txt && make pull-external-content && npm --prefix astro ci && npm --prefix astro run build"

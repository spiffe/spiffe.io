name: Link check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - run: npm --prefix astro ci

      # Installs linkchecker and pull_external.py's dependencies.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      # Advisory check: builds the site, serves it with `astro preview` and
      # crawls it with linkchecker.
      # GITHUB_TOKEN lets pull_external.py generate the SPIRE releases pages,
      # which would otherwise be skipped and reported as broken links.
      - run: make ci-check-links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

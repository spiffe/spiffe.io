# Shared ecosystem directory records.

categories:
  - name: SPIRE & Plugins
    weight: 100
    description: SPIRE, the reference implementation of SPIFFE, along with the
      plugins and tooling that extend and operate it.
    projects:
      - name: SPIRE
        identityRoles:
          - Identity issuer
        type: official
        weight: 100
        link: https://github.com/spiffe/spire
        description: A production-ready SPIFFE implementation that performs node and
          workload attestation and manages SVID issuance and rotation.
        sources:
          - label: Documentation
            url: https://github.com/spiffe/spiffe.io/blob/42e7c82fc4a8117e2fc2d6933180279aae18adeb/content/docs/latest/spiffe-about/ecosystem.md
      - name: SPIRE Controller Manager
        type: official
        weight: 200
        link: https://github.com/spiffe/spire-controller-manager
        description: Manages SPIRE registration entries and federation relationships
          from Kubernetes custom resources.
      - name: SPIRE Hardened Helm Charts
        type: official
        weight: 300
        link: https://github.com/spiffe/helm-charts-hardened
        description: A suite of production-hardened Helm charts for deploying SPIRE on
          Kubernetes.
      - name: SPIRE Identity Exchange
        type: official
        weight: 400
        link: https://github.com/spiffe/spire-identity-exchange
        description: Standalone service that allows platform-native tokens, such as
          GitHub Actions or GitLab OIDC tokens, to be exchanged for SPIRE-issued
          SVIDs.
      - name: Tornjak
        type: official
        weight: 500
        link: https://github.com/spiffe/tornjak
        description: A management UI that provides visibility and governance across one
          or more SPIRE deployments.
      - name: SPIRE TPM Plugin
        type: official
        weight: 600
        link: https://github.com/spiffe/spire-tpm-plugin
        description: Agent and server plugins that add TPM 2.0-based node attestation to
          SPIRE.
  - name: SDKs & Libraries
    weight: 200
    description: Fetch and validate SPIFFE identities directly from your application code.
    projects:
      - name: go-spiffe
        type: official
        weight: 100
        link: https://github.com/spiffe/go-spiffe
        description: SPIFFE SDK for Go.
      - name: java-spiffe
        type: official
        weight: 200
        link: https://github.com/spiffe/java-spiffe
        description: SPIFFE SDK for Java.
      - name: HewlettPackard/py-spiffe
        type: community
        weight: 400
        link: https://github.com/HewlettPackard/py-spiffe
        description: SPIFFE SDK for Python.
      - name: spiffe (Rust)
        type: community
        weight: 500
        link: https://crates.io/crates/spiffe
        description: SPIFFE SDK for Rust.
      - name: jeengbe/spiffe
        type: community
        weight: 600
        link: https://github.com/jeengbe/ts-packages/tree/master/packages/spiffe
        description: SPIFFE SDK for TypeScript.
  - name: Deployment & Workload Helpers
    weight: 300
    description: Deliver SPIFFE identities to workloads, and bridge them to
      platforms that do not speak the Workload API natively.
    projects:
      - name: SPIFFE CSI Driver
        type: official
        weight: 100
        link: https://github.com/spiffe/spiffe-csi
        description: A Kubernetes CSI driver that exposes the SPIFFE Workload API socket
          to pods.
      - name: SPIFFE Helper
        type: official
        weight: 200
        link: https://github.com/spiffe/spiffe-helper
        description: Fetches and rotates SVIDs to disk for workloads that cannot call
          the Workload API themselves.
      - name: AWS SPIFFE Workload Helper
        type: official
        weight: 300
        link: https://github.com/spiffe/aws-spiffe-workload-helper
        description: Exchanges SPIFFE SVIDs for AWS credentials via IAM Roles Anywhere.
      - name: K8S SPIFFE Workload JWT Exec Auth
        type: official
        weight: 400
        link: https://github.com/spiffe/k8s-spiffe-workload-jwt-exec-auth
        description: Bridges Kubernetes clients to the SPIFFE Workload API for
          authentication to the Kubernetes API.
      - name: K8S SPIFFE Workload Auth Config
        type: official
        weight: 500
        link: https://github.com/spiffe/k8s-spiffe-workload-auth-config
        description: Injects the SPIFFE trust bundle into the Kubernetes
          AuthenticationConfiguration file. This allows the Kubernetes API
          server to read the JWKS from the OIDC discovery provider in cases
          where it is protected by a SPIFFE-issued certificate.
  - name: Secrets Management
    weight: 400
    description: Secrets managers that can store secrets and support
      SPIFFE-authenticated workloads to retrieving them.
    projects:
      - name: SPIKE
        identityRoles:
          - Accepts identities
        type: official
        weight: 100
        link: https://github.com/spiffe/spike
        description: A SPIFFE-native secrets manage that allows workloads to use SPIFFE
          authentication to retrieve secrets.
        sources:
          - label: Documentation
            url: https://github.com/spiffe/spiffe.io/blob/42e7c82fc4a8117e2fc2d6933180279aae18adeb/content/docs/latest/spiffe-about/ecosystem.md
      - name: VMware Secrets Manager
        identityRoles:
          - Accepts identities
        type: community
        weight: 200
        link: https://github.com/vmware-tanzu/secrets-manager
        description: A Kubernetes-native secrets manager with support for SPIFFE
          authentication.
        sources:
          - label: Documentation
            url: https://github.com/spiffe/spiffe.io/blob/42e7c82fc4a8117e2fc2d6933180279aae18adeb/content/docs/latest/spiffe-about/ecosystem.md
      - name: HashiCorp Vault
        identityRoles:
          - Accepts identities
        type: commercial
        weight: 300
        link: https://developer.hashicorp.com/vault/docs/auth/spiffe
        description: Secrets manager with support for SPIFFE authentication.
      - name: Idira® Secrets Manager, SaaS by Palo Alto Networks
        identityRoles:
          - Identity issuer
          - Accepts identities
        type: commercial
        weight: 300
        link: https://www.paloaltonetworks.com/idira/machine/secrets-management
        description: SaaS secrets manager supporting SPIFFE authentication that also
          issues SPIFFE SVIDs to workloads and AI agents.
        sources:
          - label: Documentation
            url: https://github.com/spiffe/spiffe.io/blob/42e7c82fc4a8117e2fc2d6933180279aae18adeb/content/docs/latest/spiffe-about/ecosystem.md
      - name: Infisical
        identityRoles:
          - Accepts identities
        type: commercial
        weight: 300
        link: https://infisical.com/docs/documentation/platform/identities/spiffe-auth
        description: Secrets manager with support for SPIFFE authentication.
  - name: Service Meshes & Proxies
    weight: 500
    description: Service meshes and proxies that use SPIFFE identities to
      authenticate and secure traffic between workloads.
    projects:
      - name: Envoy
        type: community
        weight: 100
        link: https://www.envoyproxy.io/
        description: Service proxy that can consume SVIDs over the Envoy SDS API to
          establish mTLS.
        sources:
          - label: Documentation
            url: https://github.com/spiffe/spiffe.io/blob/42e7c82fc4a8117e2fc2d6933180279aae18adeb/content/docs/latest/spiffe-about/ecosystem.md
      - name: Istio
        identityRoles:
          - Identity issuer
        type: community
        weight: 200
        link: https://istio.io/
        description: Service mesh that issues SPIFFE identities to the workloads in the
          mesh.
        sources:
          - label: Documentation
            url: https://github.com/spiffe/spiffe.io/blob/42e7c82fc4a8117e2fc2d6933180279aae18adeb/content/docs/latest/spiffe-about/ecosystem.md
      - name: Ghostunnel
        type: community
        weight: 300
        link: https://github.com/ghostunnel/ghostunnel
        description: A TLS proxy that attaches to the SPIFFE Workload API to
          authenticate connections.
        sources:
          - label: Documentation
            url: https://github.com/spiffe/spiffe.io/blob/42e7c82fc4a8117e2fc2d6933180279aae18adeb/content/docs/latest/spiffe-about/ecosystem.md
      - name: HashiCorp Consul
        identityRoles:
          - Identity issuer
        type: community
        weight: 400
        link: https://www.consul.io/
        description: Service mesh that can issue SPIFFE identities to the services it
          manages.

# Drives the SPIFFE Ecosystem page (src/content/docs/docs/latest/spiffe-about/ecosystem.mdx)
# and any other page that lists SPIFFE software.
#
# Each entry has:
#   name, description, link   - required
#   short-name                - optional shorter name for the issuer comparison tables
#   logo                      - optional square logo, relative to public/img/logos/. Without one,
#                               SPIFFE projects show the SPIFFE or SPIRE icon and others their initials.
#   kind                      - the section it is listed under: issuers, cloud-apis,
#                               identity-providers, secrets-managers, meshes, data-platforms, cicd,
#                               pki, sdks, workload-helpers, spire-tooling
#   provenance                - spiffe (under the SPIFFE umbrella), cncf (another CNCF project, at any
#                               maturity level), open-source, or commercial.
#                               Consider the license and whether SPIFFE support is gated behind
#                               enterprise licensing; err on the side of commercial if it is not
#                               clearly open source.
#   docs                      - optional link to the entry's SPIFFE integration documentation
#   guides                    - optional list of {title, link} guides on spiffe.io
#   issues                    - for entries of kind issuers: the capabilities they support, from
#                               x509, jwt, wit, workload-api, sds, bundle-endpoint, federation,
#                               oidc-discovery, attestation, upstream-ca, kubernetes, vm, serverless,
#                               shown in the issuer comparison on the SPIFFE overview page.
#                               issues-notes maps a capability to a short caveat.
#   accepts                   - for systems that accept SVIDs: the formats they accept (x509, jwt).
#                               Only list systems that can authorize by SPIFFE ID, not just by
#                               chaining to a CA.
#
# Entries are listed SPIFFE projects first, then CNCF projects, then open source, then commercial.
# Within those groups, non-commercial entries keep the order of this file; commercial entries are
# sorted alphabetically.
entries:
  # SPIFFE issuers
  - name: SPIRE
    kind: issuers
    provenance: spiffe
    link: https://github.com/spiffe/spire
    logo: spire/icon/color/spire-icon-color.svg
    guides:
      - title: SPIRE overview
        link: /docs/latest/spire-about/
      - title: Quickstart for Kubernetes
        link: /docs/latest/try/getting-started-k8s/
    description: The SPIFFE Runtime Environment, the reference implementation of SPIFFE.
    issues: [x509, jwt, wit, workload-api, sds, bundle-endpoint, federation, oidc-discovery, attestation, upstream-ca, kubernetes, vm, serverless]
  - name: Aembit
    kind: issuers
    provenance: commercial
    link: https://aembit.io
    logo: aembit.png
    description: Workload identity and access platform that issues SPIFFE identities to workloads.
    issues: [x509, jwt, oidc-discovery, attestation, kubernetes, vm, serverless]
  - name: Cofide
    kind: issuers
    provenance: commercial
    link: https://www.cofide.io
    logo: cofide.png
    description: Workload identity platform that issues SPIFFE identities to workloads.
    issues: [x509, jwt, workload-api, sds, bundle-endpoint, federation, oidc-discovery, attestation, upstream-ca, kubernetes, vm, serverless]
  - name: Defakto
    kind: issuers
    provenance: commercial
    link: https://www.defakto.security
    logo: defakto.svg
    description: Workload identity platform that issues SPIFFE identities to workloads.
    issues: [x509, jwt, workload-api, sds, bundle-endpoint, federation, oidc-discovery, attestation, upstream-ca, kubernetes, vm, serverless]
  - name: Google Cloud managed workload identities
    short-name: Google Cloud
    kind: issuers
    provenance: commercial
    link: https://docs.cloud.google.com/iam/docs/managed-workload-identity
    logo: google-cloud.png
    description: Issues X.509-SVIDs from Certificate Authority Service to workloads on GKE (in preview) and Compute Engine.
    issues: [x509, attestation, upstream-ca, kubernetes, vm]
  - name: Idira® by Palo Alto Networks
    short-name: Idira
    kind: issuers
    provenance: commercial
    link: https://www.paloaltonetworks.com/idira
    logo: PANW-logo.svg
    description: Issues SVIDs to workloads and AI agents. Its secrets manager also accepts SVIDs.
    issues: [x509, jwt, workload-api, oidc-discovery, attestation, kubernetes, vm, serverless]
    accepts: [x509, jwt]
  - name: Red Hat Zero Trust Workload Identity Manager
    short-name: Red Hat
    kind: issuers
    provenance: commercial
    link: https://docs.redhat.com/en/documentation/openshift_container_platform/4.20/html/security_and_compliance/zero-trust-workload-identity-manager
    logo: redhat.svg
    description: OpenShift operator that manages SPIRE to issue SPIFFE identities in OpenShift clusters.
    issues: [x509, jwt, workload-api, sds, bundle-endpoint, federation, oidc-discovery, attestation, upstream-ca, kubernetes, vm]
    issues-notes: {sds: Via OpenShift Service Mesh 3.0}
  - name: Teleport Machine & Workload Identity
    short-name: Teleport MWI
    kind: issuers
    provenance: commercial
    link: https://goteleport.com/platform/machine-and-workload-identity/
    logo: teleport_logo.svg
    description: Issues SPIFFE identities to workloads as part of Teleport.
    issues: [x509, jwt, workload-api, sds, bundle-endpoint, federation, oidc-discovery, attestation, upstream-ca, kubernetes, vm]
  - name: Vijil
    kind: issuers
    provenance: commercial
    link: https://www.vijil.ai/
    logo: vijil.png
    description: Trust platform for AI agents that gives each agent a SPIFFE identity it can prove.
    issues: [x509, jwt, workload-api, attestation, kubernetes, vm, serverless]

  # Cloud, SaaS and AI APIs
  - name: Anthropic API
    kind: cloud-apis
    provenance: commercial
    link: https://platform.claude.com/docs/en/manage-claude/workload-identity-federation
    logo: anthropic.svg
    docs: https://platform.claude.com/docs/en/manage-claude/wif-providers/spiffe
    description: Workload identity federation for the Claude API accepts JWT-SVIDs in place of API keys.
    accepts: [jwt]
  - name: AWS IAM Roles Anywhere
    kind: cloud-apis
    provenance: commercial
    link: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
    logo: Amazon-Web-Services-logo.svg
    docs: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
    description: Exchanges X.509-SVIDs for temporary AWS credentials. The [AWS SPIFFE Workload Helper](https://github.com/spiffe/aws-spiffe-workload-helper) automates this for workloads.
    accepts: [x509]
  - name: AWS IAM OIDC federation
    kind: cloud-apis
    provenance: commercial
    link: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_create_oidc.html
    logo: Amazon-Web-Services-logo.svg
    description: Exchanges JWT-SVIDs for temporary AWS credentials through an IAM OIDC identity provider.
    guides:
      - title: AWS OIDC Authentication
        link: /docs/latest/keyless/oidc-federation-aws/
    accepts: [jwt]
  - name: GCP Workload Identity Federation
    kind: cloud-apis
    provenance: commercial
    link: https://docs.cloud.google.com/iam/docs/workload-identity-federation
    logo: google-cloud.png
    docs: https://docs.cloud.google.com/iam/docs/workload-identity-federation-with-x509-certificates
    description: Exchanges X.509-SVIDs and JWT-SVIDs for access to Google Cloud APIs.
    accepts: [x509, jwt]
  - name: Microsoft Entra Workload ID
    kind: cloud-apis
    provenance: commercial
    link: https://learn.microsoft.com/en-us/entra/workload-id/workload-identities-overview
    logo: azure.png
    docs: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-spiffe-spire
    description: Exchanges JWT-SVIDs for Microsoft Entra access tokens to Azure resources.
    accepts: [jwt]
  - name: OpenAI API
    kind: cloud-apis
    provenance: commercial
    link: https://developers.openai.com/api/docs/guides/workload-identity-federation
    logo: openai.svg
    docs: https://developers.openai.com/api/docs/guides/workload-identity-federation/spiffe
    description: Workload identity federation for the OpenAI API accepts JWT-SVIDs in place of API keys.
    accepts: [jwt]
  - name: Snowflake
    kind: cloud-apis
    provenance: commercial
    link: https://docs.snowflake.com/en/user-guide/workload-identity-federation
    logo: snowflake.svg
    docs: https://docs.snowflake.com/en/user-guide/workload-identity-federation#authenticate-using-spiffespire
    description: Workload identity federation for Snowflake authenticates workloads with JWT-SVIDs.
    accepts: [jwt]

  # OAuth and identity providers
  - name: Keycloak
    kind: identity-providers
    provenance: cncf
    link: https://www.keycloak.org
    logo: keycloak.svg
    docs: https://www.keycloak.org/docs/latest/server_admin/index.html#_identity_broker_spiffe
    description: Identity and access management server whose SPIFFE identity provider (in preview) lets OAuth clients authenticate with JWT-SVIDs.
    accepts: [jwt]

  # Secrets managers
  - name: SPIKE
    kind: secrets-managers
    provenance: spiffe
    link: https://github.com/spiffe/spike
    logo: spike.png
    description: Secrets manager built on SPIFFE, where workloads authenticate with their SVIDs.
    accepts: [x509]
  - name: Knox
    kind: secrets-managers
    provenance: open-source
    link: https://github.com/pinterest/knox
    logo: pinterest.svg
    description: Pinterest's secret management service, which authenticates clients with X.509-SVIDs.
    accepts: [x509]
  - name: VMware Secrets Manager
    kind: secrets-managers
    provenance: open-source
    link: https://github.com/vmware-tanzu/secrets-manager
    logo: vsecm.png
    description: Kubernetes-native secrets manager that authenticates workloads with SVIDs.
    accepts: [x509]
  - name: HashiCorp Vault
    kind: secrets-managers
    provenance: commercial
    link: https://developer.hashicorp.com/vault
    logo: vault.svg
    docs: https://developer.hashicorp.com/vault/docs/auth/spiffe
    description: Secrets manager whose SPIFFE auth method (Vault Enterprise) authenticates workloads with X.509-SVIDs or JWT-SVIDs.
    accepts: [x509, jwt]
  - name: Infisical
    kind: secrets-managers
    provenance: commercial
    link: https://infisical.com/
    logo: infisical.png
    docs: https://infisical.com/docs/documentation/platform/identities/spiffe-auth
    description: Secrets manager whose SPIFFE auth method authenticates workloads with JWT-SVIDs.
    accepts: [jwt]

  # Service meshes, proxies and runtimes
  - name: Envoy
    kind: meshes
    provenance: cncf
    link: https://www.envoyproxy.io/
    logo: envoy.svg
    description: Service proxy that can fetch SVIDs over its SDS API for mTLS.
    accepts: [x509, jwt]
  - name: Istio
    kind: meshes
    provenance: cncf
    link: https://istio.io/
    logo: istio.svg
    description: Service mesh that issues SPIFFE identities to the workloads in the mesh.
    accepts: [x509, jwt]
  - name: Ghostunnel
    kind: meshes
    provenance: open-source
    link: https://github.com/ghostunnel/ghostunnel
    logo: ghostunnel.svg
    description: TLS proxy that uses SVIDs from the Workload API to authenticate connections.
    accepts: [x509]
  - name: Traefik Proxy
    kind: meshes
    provenance: open-source
    link: https://traefik.io/traefik/
    logo: traefik.svg
    docs: https://doc.traefik.io/traefik/reference/install-configuration/tls/spiffe/
    description: Reverse proxy and ingress controller that uses X.509-SVIDs from the Workload API for mTLS to backends, verified by SPIFFE ID or trust domain.
    accepts: [x509]
  - name: Dapr
    kind: meshes
    provenance: cncf
    link: https://dapr.io/
    logo: Dapr_logo.svg
    description: Distributed application runtime that issues SPIFFE identities to applications for mTLS between them.
  - name: HashiCorp Consul
    kind: meshes
    provenance: commercial
    link: https://www.consul.io/
    logo: consul.svg
    description: Service mesh that can issue SPIFFE identities to the services it manages.

  - name: Greymatter.io
    kind: meshes
    provenance: commercial
    link: https://greymatter.io
    logo: Greymatter-logo.svg
    docs: https://greymatter.gitbook.io/grey-matter-documentation/usage/fabric/security/spire
    description: Application networking platform that incorporates SPIRE to issue and consume SPIFFE identities.
    accepts: [x509, jwt]

  # Data platforms
  - name: Apache Cassandra
    kind: data-platforms
    provenance: open-source
    link: https://cassandra.apache.org/
    logo: cassandra.svg
    docs: https://cassandra.apache.org/doc/latest/cassandra/getting-started/mtlsauthenticators.html
    description: Distributed database whose mTLS authenticator maps the SPIFFE ID in a client's X.509-SVID to a Cassandra role.
    accepts: [x509]
  - name: WarpStream
    kind: data-platforms
    provenance: commercial
    link: https://www.warpstream.com/
    logo: warpstream.png
    docs: https://docs.warpstream.com/warpstream/kafka/manage-security/mutual-tls-mtls
    description: Kafka-compatible streaming platform that can use the SPIFFE ID from an X.509-SVID as the Kafka principal.
    accepts: [x509]

  # CI/CD and GitOps
  - name: Flux
    kind: cicd
    provenance: cncf
    link: https://fluxcd.io
    logo: flux.svg
    docs: https://fluxcd.io/flux/integrations/spiffe-mtls/
    description: GitOps toolkit for Kubernetes. Its controllers use X.509-SVIDs for mTLS between each other, and JWT-SVIDs to authenticate to cloud providers.
    accepts: [x509]

  # PKI and certificate management
  - name: cert-manager
    kind: pki
    provenance: cncf
    link: https://cert-manager.io/
    logo: cert-manager.png
    docs: https://cert-manager.io/docs/usage/csi-driver-spiffe/
    description: Kubernetes certificate controller; its csi-driver-spiffe issues X.509-SVIDs to pods.

  # SDKs and libraries
  - name: go-spiffe
    kind: sdks
    provenance: spiffe
    link: https://github.com/spiffe/go-spiffe
    logo: languages/go.svg
    description: SPIFFE SDK for Go.
  - name: java-spiffe
    kind: sdks
    provenance: spiffe
    link: https://github.com/spiffe/java-spiffe
    logo: languages/java.svg
    description: SPIFFE SDK for Java.
  - name: HewlettPackard/py-spiffe
    kind: sdks
    provenance: open-source
    link: https://github.com/HewlettPackard/py-spiffe
    logo: languages/python.svg
    description: SPIFFE SDK for Python.
  - name: maxlambrecht/rust-spiffe
    kind: sdks
    provenance: open-source
    link: https://github.com/maxlambrecht/rust-spiffe
    logo: languages/rust.svg
    description: SPIFFE SDK for Rust.
  - name: jeengbe/spiffe
    kind: sdks
    provenance: open-source
    link: https://github.com/jeengbe/ts-packages/tree/master/packages/spiffe
    logo: languages/typescript.svg
    description: SPIFFE SDK for TypeScript.

  # Workload helpers
  - name: SPIFFE CSI Driver
    kind: workload-helpers
    provenance: spiffe
    link: https://github.com/spiffe/spiffe-csi
    description: A Kubernetes CSI driver that exposes the SPIFFE Workload API socket to pods.
  - name: SPIFFE Helper
    kind: workload-helpers
    provenance: spiffe
    link: https://github.com/spiffe/spiffe-helper
    description: Fetches and rotates SVIDs to disk for workloads that cannot call the Workload API themselves.
  - name: AWS SPIFFE Workload Helper
    kind: workload-helpers
    provenance: spiffe
    link: https://github.com/spiffe/aws-spiffe-workload-helper
    description: Exchanges SPIFFE SVIDs for AWS credentials via IAM Roles Anywhere.
  - name: K8s SPIFFE Workload JWT Exec Auth
    kind: workload-helpers
    provenance: spiffe
    link: https://github.com/spiffe/k8s-spiffe-workload-jwt-exec-auth
    description: Bridges Kubernetes clients to the SPIFFE Workload API for authentication to the Kubernetes API.
  - name: K8s SPIFFE Workload Auth Config
    kind: workload-helpers
    provenance: spiffe
    link: https://github.com/spiffe/k8s-spiffe-workload-auth-config
    description: Keeps the SPIFFE trust bundle in the Kubernetes API server's authentication configuration, so it can trust a SPIFFE OIDC discovery provider.

  # SPIRE extensions and tooling
  - name: SPIRE Controller Manager
    kind: spire-tooling
    provenance: spiffe
    link: https://github.com/spiffe/spire-controller-manager
    description: Manages SPIRE registration entries and federation relationships from Kubernetes custom resources.
  - name: SPIRE Hardened Helm Charts
    kind: spire-tooling
    provenance: spiffe
    link: https://github.com/spiffe/helm-charts-hardened
    description: Production-hardened Helm charts for deploying SPIRE on Kubernetes.
  - name: SPIRE Identity Exchange
    kind: spire-tooling
    provenance: spiffe
    link: https://github.com/spiffe/spire-identity-exchange
    description: Standalone service that exchanges platform-native tokens, such as GitHub Actions or GitLab OIDC tokens, for SPIRE-issued SVIDs.
  - name: Tornjak
    kind: spire-tooling
    provenance: spiffe
    link: https://github.com/spiffe/tornjak
    logo: tornjak.png
    description: Management UI for one or more SPIRE deployments.
  - name: SPIRE TPM Plugin
    kind: spire-tooling
    provenance: spiffe
    link: https://github.com/spiffe/spire-tpm-plugin
    description: Agent and server plugins that add TPM 2.0-based node attestation to SPIRE.

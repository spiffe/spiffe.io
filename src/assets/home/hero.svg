<svg class="illus" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="hero-art-title hero-art-desc">
<title id="hero-art-title">A workload presents a verifiable identity to another service</title>
<desc id="hero-art-desc">A workload sends a signed SPIFFE identity credential to another service. The receiving service verifies it and makes its own access decision. Workloads can be services, jobs, or agents running across different environments.</desc>
